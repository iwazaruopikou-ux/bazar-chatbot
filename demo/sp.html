<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資料請求チャットボット スマホ版デモ</title>
<link rel="stylesheet" href="../chatbot/chatbot.css">
<style>
  body { margin: 0 auto; max-width: 480px; background: #faf8f5; color: #222; font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; font-size: 14px; }
  .demo-note { background: #fffbe0; border: 1px solid #e8d36b; padding: 10px 12px; margin: 10px 12px; border-radius: 6px; line-height: 1.7; font-size: 13px; }
  .hero { background: #7a5a44; color: #fff; padding: 40px 16px; font-size: 20px; font-weight: bold; }
  .hb-form-card, .hb-bottom-form { background: #fff; margin: 8px 12px; border-radius: 16px; padding: 20px 16px; box-shadow: 0 6px 24px rgba(74,55,40,.12); }
  .hb-form-card select, .hb-bottom-form select { width: 100%; padding: 12px; font-size: 15px; }
  .hb-submit-btn { width: 100%; padding: 14px; margin-top: 10px; font-size: 16px; font-weight: bold; background: #c0392b; color: #fff; border: 0; border-radius: 10px; }
  .section { padding: 16px 12px; }
  #result { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 2147483600; padding: 16px; }
  #result .box { background: #fff; border-radius: 8px; padding: 16px; max-height: 85vh; overflow: auto; }
  #result pre { white-space: pre-wrap; font-size: 12px; background: #f7f7f7; padding: 10px; }
</style>
</head>
<body>
<p class="demo-note"><b>スマホ版のデモです。</b>quotes_search_sp.php の作りをまねています。チャットで答えると、裏で元のスマホ用フォーム（quotes_send_sp.php のコピー）が埋まります。実際には送信されません。</p>
<div class="hero">地域の工務店にまとめて資料請求</div>

<!-- 本物と同じ：都道府県を選ぶフォーム（vid[] の隠し欄つき） -->
<div class="hb-form-card">
  <div>まずは建築予定地・希望地の都道府県を選択</div>
  <form action="" method="get" class="chokusetsu">
    <select name="province"><option value="">都道府県を選択して下さい</option></select>
    <input type="hidden" name="vid[]" value="501"/>
    <input type="hidden" name="vid[]" value="502"/>
    <button type="submit" name="send_quotes" value="ok" class="hb-submit-btn">続いて市区町村を選ぶ</button>
  </form>
</div>

<div class="section">安心して利用できる理由（画像）</div>

<div class="hb-bottom-form">
  <div>もう一度、資料請求はこちらから</div>
  <form action="" method="get" class="chokusetsu">
    <select name="province"><option value="">都道府県を選択して下さい</option></select>
    <button type="submit" name="send_quotes" value="ok" class="hb-submit-btn">続いて市区町村を選ぶ</button>
  </form>
</div>

<div id="result"><div class="box"><b>本来ならこの内容が送信されます</b><pre></pre>
<button type="button" onclick="document.getElementById('result').style.display='none'">閉じる</button></div></div>

<script>
var PREFS = ['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
document.querySelectorAll('select[name=province]').forEach(function (s) { PREFS.forEach(function (p, i) { s.add(new Option(p, i + 1)); }); });
window.showDemoResult = function (text) { var r = document.getElementById('result'); r.querySelector('pre').textContent = text; r.style.display = 'block'; };
// デモ用：本物の /js/city.php・quotes_city_select_sp.php の代わり
window.HB_CHATBOT_CONFIG = { icon: '../chatbot/icon.png', sp: { cityUrl: 'city-demo.json', formUrl: 'sp_form.html' } };
</script>
<script src="../chatbot/chatbot.js"></script>
</body>
</html>
